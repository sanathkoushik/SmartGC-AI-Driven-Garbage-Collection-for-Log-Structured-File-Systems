# ==============================================================================
# SmartGC System Configuration
# ==============================================================================

# Global seed for reproducible runs (simulator workloads & ML splitting/training)
random_seed: 42

# ------------------------------------------------------------------------------
# Simulator Geometry & Baseline Parameters (Phase 1+)
# ------------------------------------------------------------------------------
simulator:
  # Size of each individual block in bytes (default: 4096 bytes / 4KB)
  block_size_bytes: 4096

  # Number of blocks contained within a single segment (e.g., 64 blocks = 256KB segment)
  blocks_per_segment: 64

  # Total number of physical segments available in the storage pool
  total_segments: 32

  # GC trigger threshold (low watermark):
  # Trigger GC when free segments count <= gc_free_segments_threshold
  gc_free_segments_threshold: 2

  # Garbage Collection victim selection policy:
  # Options: GREEDY (minimum valid blocks)
  gc_policy: "GREEDY"

  # Placement policy for incoming writes. The Phase 4a baseline ladder:
  #   MIXED (baseline) -> RULE_BASED (zero-training threshold) ->
  #   SUP_LIKE (SUP-GC: default-hot-on-write, cold-on-GC-copy) ->
  #   STAT_ML (lightweight sklearn) -> LSTM_SMARTGC (vanilla LSTM) ->
  #   LSTM_ATTN_SMARTGC (LSTM + additive attention, multi-stream)
  placement_policy: "MIXED"

# ------------------------------------------------------------------------------
# Synthetic Workload Generator Settings (Phase 1 Validation)
# ------------------------------------------------------------------------------
synthetic_workload:
  total_requests: 5000
  lba_range_min: 0
  lba_range_max: 500
  hot_ratio: 0.20          # 20% of LBAs are hot
  hot_traffic_ratio: 0.80  # Hot LBAs receive 80% of write traffic (Zipf/Pareto principle)

# ------------------------------------------------------------------------------
# ML Subsystem & LSTM Hyperparameters (Phase 2 - Phase 4 Placeholders)
# ------------------------------------------------------------------------------
ml:
  sequence_length: 10      # Number of past rewrite intervals in input window
  hidden_dim: 64           # LSTM hidden state dimension
  num_layers: 2            # Number of stacked LSTM layers
  dropout: 0.1             # Dropout probability
  batch_size: 64           # Mini-batch training size
  learning_rate: 0.001     # Adam optimizer learning rate
  epochs: 25               # Training epochs (upper bound)
  early_stop_patience: 4   # stop if val loss does not improve for N epochs (0 = off)
  loss_function: "SmoothL1" # MAE / SmoothL1
  train_split: 0.70        # Train dataset fraction (chronological)
  val_split: 0.15          # Validation dataset fraction (chronological)
  test_split: 0.15         # Test dataset fraction (chronological)
  hot_percentile_cutoff: 30 # Phase 4b: initial/seed cutoff; superseded at runtime
                            # by the rolling percentile over hot_cutoff_window_events

  # ---- STAT_ML (Phase 4a rung 4) lightweight sklearn regressor ----
  stat_ml_max_iter: 200
  stat_ml_learning_rate: 0.08
  stat_ml_max_depth: 6

  # ---- Phase 4b: dynamic thresholding, drift, confidence gate ----
  hot_cutoff_window_events: 2000      # rolling percentile window
  drift_kl_threshold: 0.15            # drift flag trigger (KL between consecutive windows)
  confidence_fallback_threshold: 0.55 # below this -> fall back to RULE_BASED for that block
  drift_window_events: 2000           # window size for the drift detector
  confidence_ensemble_size: 3         # lightweight models for predictive-variance confidence

  # ---- Phase 4a rung 6: attention ----
  attention:
    enabled: true
    num_heads: 2                      # small - lightweight per-block model, not an LLM

# ------------------------------------------------------------------------------
# GC-time learned component (Phase 5)
# ------------------------------------------------------------------------------
gc:
  learned_trigger: false              # ablation switch
  trigger_state_window_events: 500
  migration_stream_count: 3           # SHORT / MEDIUM / LONG destination classes
  controller_algorithm: "q_learning"  # q_learning | contextual_bandit
  controller_episodes: 40
  controller_epsilon: 0.15
  controller_alpha: 0.30
  controller_gamma: 0.90

# ------------------------------------------------------------------------------
# Evaluation & cost accounting (Phase 6 & 7)
# ------------------------------------------------------------------------------
evaluation:
  op_ratio_sweep: [0.10, 0.20, 0.30]      # live-set / capacity ratios for the OP sweep
  real_op_ratio: 0.66                      # live-set / capacity for the real-trace matrix leg
                                          # (~1.5x OP so GC actually engages on the wide OLTP trace)
  real_trace_name: "financial1"           # UMass/SPC Financial1 OLTP trace (76.8% writes)
  real_trace_max_events: 400000           # bounded event prefix for the LSTM+sim pipeline (71.9% writes)
  drift_scenario_name: "synthetic_drift"  # concatenated two-phase synthetic workload
